<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="100" y="120" font-size="30" fill="#047857" font-weight="bold">POINTERS 101 · SLIDE 1</text>
  <text x="100" y="220" font-size="76" font-weight="bold" fill="#17251e">Pointers &amp; memory</text>
  <text x="100" y="340" font-size="44" fill="#17251e">• Every variable lives at an address in memory.</text>
  <text x="100" y="420" font-size="44" fill="#17251e">• A pointer is a variable that stores an address.</text>
  <text x="100" y="500" font-size="44" fill="#17251e">• &amp;x gives the address of x.</text>
  <text x="100" y="580" font-size="44" fill="#17251e">• *p follows the pointer p to the value it points at.</text>
  <rect x="100" y="660" width="1400" height="140" rx="20" fill="#f1f5f9"/>
  <text x="140" y="745" font-size="40" font-family="Courier New, monospace" fill="#0f172a">int value = 42;   int *p = &amp;value;</text>
</svg>
